<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Brand Gold/Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Trust Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shield Shape (Trust & Verification) -->
  <path d="M 256 90 L 390 140 C 390 270 330 365 256 415 C 182 365 122 270 122 140 Z"
        fill="#0f172a" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#goldGlow)" />

  <!-- Stylized "K" & Artisan Hammer/Wrench Geometric Cross inside Shield -->
  <!-- Upper Left to Center Angled Wrench Beam -->
  <path d="M 220 185 L 220 335" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
  
  <!-- Right Upper Diagonal Beam -->
  <path d="M 225 255 L 310 180" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Right Lower Diagonal Beam -->
  <path d="M 225 255 L 315 335" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" />

  <!-- Verification Sparkle / Badge at Top Center of Shield -->
  <circle cx="256" cy="148" r="14" fill="url(#emeraldGrad)" />
  <path d="M 250 148 L 254 153 L 263 143" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
