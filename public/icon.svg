<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Glowing Amber/Gold Badge Gradient -->
    <linearGradient id="pwaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Spark Glow Filter -->
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#pwaBgGrad)" />

  <!-- Outer Golden Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#pwaGoldGrad)" stroke-width="6" stroke-opacity="0.35" />

  <!-- Inner Amber Glowing Squircle Badge -->
  <rect x="76" y="76" width="360" height="360" rx="84" fill="url(#pwaGoldGrad)" />
  <rect x="82" y="82" width="348" height="348" rx="78" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" fill="none" />

  <!-- Bold Modern 'J' in Dark Slate -->
  <path
    d="M 292 150
       L 292 290
       C 292 332 264 362 218 362
       C 178 362 152 338 152 304
       C 152 284 167 270 188 270
       C 207 270 219 283 222 299
       C 224 312 232 320 244 320
       C 256 320 262 310 262 290
       L 262 150
       Z"
    fill="#09090b"
  />

  <!-- Glowing Firefly Sparkle at Top-Right of 'J' -->
  <g transform="translate(340, 145)" filter="url(#sparkGlow)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" opacity="0.4" />
    <path
      d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z"
      fill="#ffffff"
    />
  </g>
</svg>
