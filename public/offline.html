<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>ऑफ़लाइन | Jugnu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 12px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: #f59e0b;
      color: #020617;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      background: #d97706;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">⚡</div>
    <h1>आप ऑफ़लाइन हैं</h1>
    <h2>You are currently offline</h2>
    <p>
      इंटरनेट कनेक्शन उपलब्ध नहीं है। कृपया अपना डेटा या वाई-फ़ाई जांचें और दोबारा प्रयास करें।<br>
      Please check your network connection and retry.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 पुनः प्रयास करें (Retry)
    </button>
  </div>
</body>
</html>
